name: Build and Push Docker Image

# KAB chalega:
#   pull_request -> PR khulne/update hone par sirf build check (push nahi)
#   push (main)  -> PR merge hone par build + Docker Hub pe push
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest   # GitHub free me ek fresh Ubuntu machine deta hai

    steps:
      # Step 1: Repo ka code runner machine pe laao
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Docker Hub me login (secrets repo settings me rakhe hain)
      #   Sirf main branch pe login, kyunki image sirf main se push hoti hai
      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Step 3: Buildx setup (fast builds + caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 4: Image build karke Docker Hub pe push
      #   PR / feature branch pe sirf build hota hai (code sahi hai ya nahi, check karne ke liye)
      #   Sirf main pe build + push hota hai (manual "Run workflow" pe bhi yahi rule)
      #   latest       -> hamesha nayi image
      #   <commit-sha> -> har version alag, rollback ke liye kaam aata hai
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/gihubflotest:latest
            ${{ secrets.DOCKER_USERNAME }}/gihubflotest:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
