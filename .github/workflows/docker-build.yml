name: Build and Push Docker Image

# KAB chalega: main branch pe push hone par, ya Actions tab se manually
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest   # GitHub free me ek fresh Ubuntu machine deta hai

    steps:
      # Step 1: Repo ka code runner machine pe laao
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Docker Hub me login (secrets repo settings me rakhe hain)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Step 3: Buildx setup (fast builds + caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 4: Image build karke Docker Hub pe push
      #   latest       -> hamesha nayi image
      #   <commit-sha> -> har version alag, rollback ke liye kaam aata hai
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/gihubflotest:latest
            ${{ secrets.DOCKER_USERNAME }}/gihubflotest:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
